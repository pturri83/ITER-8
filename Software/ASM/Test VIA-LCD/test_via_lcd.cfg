# Linker script for the 'test_via_lcd.asm' assembly script.

# ======================================================================================================================

MEMORY {

    ROM:
        start       = $8000,
        size        = $8000,
        fill        = yes,
        fillval     = $00;

    RAM_0:
        start       = $0000,
        size        = $0200;

    RAM_1:
        start       = $0200,
        size        = $3E00;
}

# ======================================================================================================================

SEGMENTS {

    HEAD:
        load        = ROM,
        type        = ro,
        offset      = $0000;

    DEBUG:
        load        = ROM,
        type        = ro,
        align       = $0100;

    CODE:
        load        = ROM,
        type        = ro,
        align       = $0100;

    LIB:
        load        = ROM,
        type        = ro,
        align       = $0100;

    RODATA:
        load        = ROM,
        type        = ro,
        align       = $0100;

    DATA:
        load        = ROM,
        run         = RAM_1,
        type        = ro,
        align_load  = $0100,
        define      = yes;

    VECTORS:
        load        = ROM,
        type        = ro,
        start       = $FFFA;

    ZEROPAGE:
        load        = RAM_0,
        type        = zp,
        start       = $0000;

    STACK:
        load        = RAM_0,
        type        = bss,
        start       = $0100,
        optional    = yes;

    BSS:
        load        = RAM_1,
        type        = bss,
        define      = yes;
}
